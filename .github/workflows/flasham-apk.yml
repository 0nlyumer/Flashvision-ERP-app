name: FlashAM APK

# Manual trigger only — builds the FlashAM (Capacitor) debug APK in the cloud
# because the local sandbox cannot run Gradle (JVM NIO is broken there).
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sale_orders_app/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install app dependencies
        working-directory: sale_orders_app
        run: npm ci

      - name: Build web assets
        working-directory: sale_orders_app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: sale_orders_app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: sale_orders_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashAM-debug-apk
          path: sale_orders_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
